name: ANBIMA Daily Update

# Workflow de backup/fallback manual da pipeline ANBIMA.
#
# A partir da Fase 4 (probe horario), o pipeline canonico passa a ser
# .github/workflows/anbima_b3_probe.yml -- que roda de hora em hora 19h-05h
# BRT e so importa quando TODOS os 5 arquivos do dia estao publicados
# (ANBIMA Debentures + ETTJ + TPF + B3 Trade + B3 ConsolidatedRecords).
#
# Este workflow continua disponivel via workflow_dispatch (UI do GitHub)
# para reprocessamento manual de um dia especifico OU em caso de fallback
# se o probe estiver com problema. Logica interna intacta:
#   1. scripts/list_target_dates.py : computa janela de 5 dias uteis B3
#                                     (hoje + 4 dias uteis anteriores)
#   2. fetch_anbima.py    : baixa db<YYMMDD>.txt + CZ-down.asp + ms<YYMMDD>.txt
#                            das URLs publicas anbima.com.br (sem auth)
#   3. compute_spreads.py : calcula spreads por lookup exato + history/<date>.json
#   4. build_dashboard.py : regenera data/*.json + index.html
#   5. commit + push (se houver snapshot novo)
#
# Idempotencia: history/<D>.json existente -> pula a data sem refetch. Se a
# janela inteira ja' foi capturada, o workflow nao chama build_dashboard nem
# commita (log "sem dados novos").

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data alvo YYYY-MM-DD (vazio = hoje BRT + catch-up 5 dias uteis B3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  anbima-daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard - verifica se hoje eh dia util B3
        id: guard
        run: |
          DU=$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; from b3_calendar import is_b3_business_day; hoje = datetime.now(ZoneInfo('America/Sao_Paulo')).date(); print('true' if is_b3_business_day(hoje) else 'false')")
          echo "is_business_day=$DU" >> "$GITHUB_OUTPUT"
          if [ "$DU" = "true" ]; then
            echo "[guard] hoje BRT eh dia util B3 -- prosseguindo"
          else
            echo "[guard] hoje BRT NAO eh dia util B3 (fim de semana ou feriado) -- pulando todos os steps"
          fi

      - name: Resolve target dates (5 dias uteis B3)
        id: dates
        if: steps.guard.outputs.is_business_day == 'true'
        run: |
          INPUT='${{ inputs.target_date }}'
          if [ -n "$INPUT" ]; then
            DATES="$INPUT"
          else
            # Janela B3: HOJE (BRT) + 4 dias uteis B3 anteriores, pulando
            # fds e feriados B3 (Sexta Santa, Carnaval seg+ter, Corpus Christi,
            # 25/jan, 20/nov, demais nacionais).
            DATES=$(python3 scripts/list_target_dates.py)
          fi
          echo "Datas alvo:"
          echo "$DATES"
          {
            echo 'dates<<EOF'
            echo "$DATES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run fetch_anbima + compute_spreads por data
        id: fetch
        if: steps.guard.outputs.is_business_day == 'true'
        run: |
          set -u
          mkdir -p raw
          FAIL_COUNT=0
          OK_COUNT=0
          SKIP_404_COUNT=0
          SKIP_EXISTING_COUNT=0
          NEW_DATES=""
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            echo "::group::ANBIMA $d"
            # Idempotencia: history/<D>.json ja capturado -> pula sem refetch.
            if [ -f "history/${d}.json" ]; then
              echo "[skip] history/${d}.json ja existe; pulando."
              SKIP_EXISTING_COUNT=$((SKIP_EXISTING_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            python3 fetch_anbima.py --date "$d" --out parsed.json && RC=0 || RC=$?
            if [ "$RC" -eq 2 ]; then
              echo "[skip] $d: ANBIMA 404 (fds/feriado ou ainda nao publicado)"
              SKIP_404_COUNT=$((SKIP_404_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            if [ "$RC" -ne 0 ]; then
              echo "::error::fetch_anbima.py falhou para $d (exit=$RC)"
              FAIL_COUNT=$((FAIL_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            python3 compute_spreads.py --date "$d" --in parsed.json --out data.json
            OK_COUNT=$((OK_COUNT+1))
            if [ -z "$NEW_DATES" ]; then
              NEW_DATES="$d"
            else
              NEW_DATES="${NEW_DATES}, ${d}"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.dates.outputs.dates }}"
          echo "[summary] novos=$OK_COUNT existentes=$SKIP_EXISTING_COUNT 404=$SKIP_404_COUNT falhas=$FAIL_COUNT"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::${FAIL_COUNT} data(s) falharam no fetch/spread (erro real, nao-404)"
            exit 1
          fi
          echo "new_count=$OK_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_dates=$NEW_DATES" >> "$GITHUB_OUTPUT"

      - name: Rebuild dashboard (data/*.json + index.html)
        if: steps.guard.outputs.is_business_day == 'true' && steps.fetch.outputs.new_count != '0'
        run: |
          python3 build_dashboard.py

      - name: Commit & push (snapshots ANBIMA)
        if: steps.guard.outputs.is_business_day == 'true' && steps.fetch.outputs.new_count != '0'
        env:
          NEW_DATES: ${{ steps.fetch.outputs.new_dates }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Pull --rebase antes de stage/commit: este workflow eh backup
          # manual, mas pode rodar concorrente com o probe canonico
          # (anbima_b3_probe.yml). Rebase --autostash minimiza race; conflito
          # real -> exit 1, sem mascarar.
          if ! git pull --rebase --autostash origin main; then
            echo "::error::git pull --rebase falhou (conflito?); abortando push"
            exit 1
          fi
          git add data/ history/ data.json index.html
          if git diff --cached --quiet; then
            echo "Sem dados novos pra commitar (history/data/index.html inalterados)"
            exit 0
          fi
          git commit -m "feat: ANBIMA snapshot ${NEW_DATES} (run via daily_update.yml)"
          git push

      - name: Step summary
        if: always()
        run: |
          echo "## ANBIMA Daily Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Datas processadas:** ${{ steps.fetch.outputs.new_dates }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Snapshots novos:** ${{ steps.fetch.outputs.new_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Janela alvo" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.dates.outputs.dates }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anbima-daily-${{ github.run_id }}
          path: |
            parsed.json
            data.json
            data/
            history/
            raw/
          retention-days: 7
          if-no-files-found: ignore
