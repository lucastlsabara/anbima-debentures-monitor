name: B3 Trades

# Workflow de backup/fallback manual da coleta de trades B3 (DEB/CRA/CRI/CFF/COE)
# + consolidated records.
#
# A partir da Fase 4 (probe horario), o pipeline canonico passa a ser
# .github/workflows/anbima_b3_probe.yml -- que roda de hora em hora 19h-05h
# BRT e ja faz fetch_b3_trades.py + fetch_b3_trades_consolidated.py quando
# todos os 5 arquivos do dia estao publicados.
#
# Este workflow continua disponivel via workflow_dispatch para:
#   - Reprocessar um dia/range especifico via mode=backfill
#   - Disparar coleta isolada (so B3) sem esperar o probe
# Logica interna intacta (fetch_day / backfill / podar_historico / rebuild).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch_day (1 dia) ou backfill (range)'
        type: choice
        required: true
        default: fetch_day
        options:
          - fetch_day
          - backfill
      start_date:
        description: 'YYYY-MM-DD (apenas para mode=backfill)'
        required: false
        default: ''
      end_date:
        description: 'YYYY-MM-DD (apenas para mode=backfill)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-b3-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt cobre requests + holidays + pytz (b3_calendar)
          # + numpy/scipy/pandas (compute_spreads usado por build_dashboard).
          pip install -r requirements.txt

      - name: Guard - verifica se hoje eh dia util B3
        id: guard
        run: |
          DU=$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; from b3_calendar import is_b3_business_day; hoje = datetime.now(ZoneInfo('America/Sao_Paulo')).date(); print('true' if is_b3_business_day(hoje) else 'false')")
          echo "is_business_day=$DU" >> "$GITHUB_OUTPUT"
          if [ "$DU" = "true" ]; then
            echo "[guard] hoje BRT eh dia util B3 -- prosseguindo"
          else
            echo "[guard] hoje BRT NAO eh dia util B3 (fim de semana ou feriado) -- pulando todos os steps"
          fi

      - name: Resolve mode
        id: mode
        if: steps.guard.outputs.is_business_day == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=fetch_day
          else
            MODE='${{ inputs.mode }}'
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo selecionado: $MODE"

      - name: Validate backfill inputs
        if: steps.guard.outputs.is_business_day == 'true' && steps.mode.outputs.mode == 'backfill'
        run: |
          START='${{ inputs.start_date }}'
          END='${{ inputs.end_date }}'
          if [ -z "$START" ] || [ -z "$END" ]; then
            echo "::error::mode=backfill exige start_date e end_date (YYYY-MM-DD)"
            exit 1
          fi
          if ! date -d "$START" >/dev/null 2>&1 || ! date -d "$END" >/dev/null 2>&1; then
            echo "::error::Datas invalidas: start_date=$START end_date=$END"
            exit 1
          fi
          echo "Backfill range: $START -> $END"

      - name: Run fetch_day (trade-by-trade)
        if: steps.guard.outputs.is_business_day == 'true' && steps.mode.outputs.mode == 'fetch_day'
        run: |
          echo "Rodando fetch_b3_trades.py (5 dias uteis B3)"
          python fetch_b3_trades.py

      - name: Run fetch_day (consolidated)
        if: steps.guard.outputs.is_business_day == 'true' && steps.mode.outputs.mode == 'fetch_day'
        run: |
          echo "Rodando fetch_b3_trades_consolidated.py (5 dias uteis B3)"
          python fetch_b3_trades_consolidated.py

      - name: Run backfill (trade-by-trade)
        if: steps.guard.outputs.is_business_day == 'true' && steps.mode.outputs.mode == 'backfill'
        run: |
          echo "Rodando backfill_b3_trades.py ${{ inputs.start_date }} ${{ inputs.end_date }}"
          python backfill_b3_trades.py '${{ inputs.start_date }}' '${{ inputs.end_date }}'

      - name: Run backfill (consolidated)
        if: steps.guard.outputs.is_business_day == 'true' && steps.mode.outputs.mode == 'backfill'
        run: |
          echo "Rodando backfill_b3_trades_consolidated.py ${{ inputs.start_date }} ${{ inputs.end_date }}"
          python backfill_b3_trades_consolidated.py '${{ inputs.start_date }}' '${{ inputs.end_date }}'

      - name: Podar historico
        if: steps.guard.outputs.is_business_day == 'true'
        run: |
          echo "Aplicando politica de retencao 60 du B3 em data/b3_trades*/"
          python scripts/podar_historico.py

      - name: Rebuild dashboard
        if: steps.guard.outputs.is_business_day == 'true'
        run: |
          echo "Regenerando index.html com BUILD_VERSION atualizado"
          python build_dashboard.py

      - name: Commit & push
        if: steps.guard.outputs.is_business_day == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/b3_trades/ data/b3_trades_consolidated/ index.html
          if git diff --cached --quiet; then
            echo "Sem mudanca em data/b3_trades/, data/b3_trades_consolidated/ ou index.html — pulando commit."
            exit 0
          fi
          DATE_TAG=$(date -u +%Y-%m-%d)
          git commit -m "data: b3 trades update ${DATE_TAG} (workflow ${MODE})"
          # Pull --rebase antes do push: evita race com a Routine ANBIMA que
          # tambem commita em main (data/*.json, history/*.json, index.html).
          git pull --rebase origin main
          git push
