name: Medir horarios de publicacao (ANBIMA + B3)

# Ferramenta de diagnostico temporaria: mede em que horario cada um dos 5
# arquivos diarios (ANBIMA Debentures, ETTJ, TPF; B3 Trade, ConsolidatedRecords)
# foi disponibilizado nos ultimos N dias uteis B3. Apenas leitura -- nao
# altera estado do repo.
#
# Disparo: manual via workflow_dispatch. Sem cron.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Data ancora YYYY-MM-DD (vazio = hoje BRT). Os N dias uteis B3 anteriores a ela sao medidos.'
        required: false
        default: ''
      n:
        description: 'Quantos dias uteis B3 medir (default 5).'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Medir horarios de publicacao
        id: medir
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_N: ${{ inputs.n }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${INPUT_DATE:-}" ]; then
            ARGS+=(--date "$INPUT_DATE")
          fi
          if [ -n "${INPUT_N:-}" ]; then
            ARGS+=(--n "$INPUT_N")
          fi
          # Captura stdout (tabela markdown) em arquivo; stderr (logs) vai para o run.
          python3 scripts/measure_publication_times.py "${ARGS[@]}" \
            | tee measure_output.md

      - name: Escrever sumario no GITHUB_STEP_SUMMARY
        if: always()
        run: |
          if [ -f measure_output.md ]; then
            cat measure_output.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Medicao falhou antes de gerar saida" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload markdown como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure_publication_times
          path: measure_output.md
          if-no-files-found: ignore
