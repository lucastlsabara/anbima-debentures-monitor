name: ANBIMA + B3 Probe & Import

# Workflow UNICO que substitui o cron de daily_update.yml e b3_trades.yml.
#
# Roda 3 slots noturnos por dia util B3 (21h, 00h, 03h BRT). Cada
# execucao processa o dia util corrente (determinado pelo step
# "Determine target date" com regra hora>=19 -> HOJE, senao ONTEM).
#
# A cada execucao:
#   1. Determina o dia alvo (HOJE BRT se hora>=19, senao ONTEM BRT).
#      Slot 21h BRT -> HOJE; slots 00h/03h BRT -> ONTEM.
#   2. Guard B3: se nao for dia util B3, sai 0 sem fazer nada.
#   3. Probe: verifica disponibilidade dos 5 arquivos (ANBIMA Debentures,
#      ANBIMA ETTJ, ANBIMA TPF, B3 Trade, B3 ConsolidatedRecords).
#   4. Se TODOS os 5 estao publicados: importa ANBIMA (gap-fill 5 du B3),
#      importa B3 com CACHE CHECK ROBUSTO (3 indicadores: lastUpdateDate
#      + totalRecords + firstPageBytes), refetch full SOMENTE dos dias
#      que mudaram, rebuild dashboard, commit & push.
#   5. Se ALGUM faltando: loga e termina verde sem commitar. O proximo
#      slot tenta de novo.
#
# Sem marker de idempotencia diaria (removido em PR anterior). Multiplos
# slots noturnos servem para pegar republicacoes da B3 dentro do mesmo
# dia util — o cache check garante que slots subsequentes processem em
# ~30s-1min quando nada mudou.

on:
  schedule:
    # 3 slots noturnos: 21h, 00h, 03h BRT (= 00h, 03h, 06h UTC) ter-sab UTC.
    # Cada slot verifica metadata da B3 e refetch SO os dias que mudaram.
    # Sem marker de idempotencia diaria (removido em PR anterior).
    #
    # Validacao de bordas (BRT = UTC-3):
    #  21h BRT seg = 00h UTC ter (dia 2) -> dispara, ref = HOJE (seg, hour=21 >= 19)
    #  00h BRT ter = 03h UTC ter (dia 2) -> dispara, ref = ONTEM (seg, hour=0  < 19)
    #  03h BRT ter = 06h UTC ter (dia 2) -> dispara, ref = ONTEM (seg)
    #  21h BRT ter = 00h UTC qua (dia 3) -> dispara, ref = HOJE  (ter)
    #  00h BRT qua = 03h UTC qua (dia 3) -> dispara, ref = ONTEM (ter)
    #  ... (mesmo padrao ate sex 21h BRT = 00h UTC sab)
    #  03h BRT sab = 06h UTC sab (dia 6) -> dispara, ref = ONTEM (sex)
    #  21h BRT sab = 00h UTC dom (dia 0) -> BLOQUEIA (0 nao esta em 2-6)
    #  21h BRT dom = 00h UTC seg (dia 1) -> BLOQUEIA (1 nao esta em 2-6)
    #
    # day-of-week 2-6 cobre 21h BRT seg-sex (=00h UTC ter-sab) e
    # 00h/03h BRT ter-sab (=03h/06h UTC ter-sab). Bloqueia 21h BRT
    # sab/dom (que mapeariam ref=fds). Guard B3 corta feriados moveis.
    - cron: '0 0,3,6 * * 2-6'   # 21h/00h/03h BRT -> ref segue regra hora>=19
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data alvo YYYY-MM-DD (vazio = derivar de HOJE BRT conforme horario)'
        required: false
        default: ''

permissions:
  contents: write

# Compartilha grupo com b3_trades_intraday.yml como safety net: se algum dia
# janelas se sobreporem, evita dois push concorrentes em main.
concurrency:
  group: anbima-b3-pipeline
  cancel-in-progress: false

jobs:
  probe-and-import:
    runs-on: ubuntu-latest
    # 180min (3h) = wall-clock 2h30 do fetch_b3_trades_consolidated.py + 30min
    # de buffer (setup, ANBIMA, B3 Trade, podar, rebuild dashboard, commit & push).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine target date (HOJE/ONTEM BRT conforme hora)
        id: target
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          set -eu
          TARGET_DATE=$(python3 - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          inp = (os.environ.get("INPUT_DATE") or "").strip()
          if inp:
              # Valida formato; deixa o probe falhar adiante caso seja invalido.
              datetime.strptime(inp, "%Y-%m-%d")
              print(inp)
          else:
              agora = datetime.now(ZoneInfo("America/Sao_Paulo"))
              if agora.hour >= 19:
                  alvo = agora.date()
              else:
                  alvo = agora.date() - timedelta(days=1)
              print(alvo.isoformat())
          PY
          )
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "[target] dia alvo: $TARGET_DATE"

      - name: Guard - verifica se target_date eh dia util B3
        id: guard
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          DU=$(python3 -c "
          import os
          from datetime import date
          from b3_calendar import is_b3_business_day
          d = date.fromisoformat(os.environ['TARGET_DATE'])
          print('true' if is_b3_business_day(d) else 'false')
          ")
          echo "is_business_day=$DU" >> "$GITHUB_OUTPUT"
          if [ "$DU" = "true" ]; then
            echo "[guard] $TARGET_DATE eh dia util B3 -- prosseguindo para probe"
          else
            echo "[guard] $TARGET_DATE NAO eh dia util B3 (fds ou feriado) -- encerrando verde"
          fi

      - name: Probe - verifica disponibilidade dos 5 arquivos
        id: probe
        if: steps.guard.outputs.is_business_day == 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -u
          python3 scripts/probe_files.py \
            --date "$TARGET_DATE" \
            --github-output "$GITHUB_OUTPUT" && RC=0 || RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "[probe] todos os 5 arquivos disponiveis -- prosseguindo para import"
          elif [ "$RC" -eq 2 ]; then
            echo "[probe] algum arquivo faltando -- encerrando verde sem importar"
          else
            echo "::error::probe_files.py falhou com exit=$RC (erro real, nao 'faltando')"
            exit "$RC"
          fi

      - name: Resolve datas alvo ANBIMA (5 du B3)
        id: dates
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          DATES=$(python3 scripts/list_target_dates.py --date "$TARGET_DATE")
          echo "Datas alvo ANBIMA:"
          echo "$DATES"
          {
            echo 'dates<<EOF'
            echo "$DATES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Import ANBIMA (gap-fill 5 du B3)
        id: import_anbima
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          set -u
          mkdir -p raw
          FAIL_COUNT=0
          OK_COUNT=0
          SKIP_404_COUNT=0
          SKIP_EXISTING_COUNT=0
          NEW_DATES=""
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            echo "::group::ANBIMA $d"
            if [ -f "history/${d}.json" ]; then
              echo "[skip] history/${d}.json ja existe; pulando."
              SKIP_EXISTING_COUNT=$((SKIP_EXISTING_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            python3 fetch_anbima.py --date "$d" --out parsed.json && RC=0 || RC=$?
            if [ "$RC" -eq 2 ]; then
              echo "[skip] $d: ANBIMA 404 (fds/feriado ou ainda nao publicado)"
              SKIP_404_COUNT=$((SKIP_404_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            if [ "$RC" -ne 0 ]; then
              echo "::error::fetch_anbima.py falhou para $d (exit=$RC)"
              FAIL_COUNT=$((FAIL_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            python3 compute_spreads.py --date "$d" --in parsed.json --out data.json
            OK_COUNT=$((OK_COUNT+1))
            if [ -z "$NEW_DATES" ]; then
              NEW_DATES="$d"
            else
              NEW_DATES="${NEW_DATES}, ${d}"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.dates.outputs.dates }}"
          echo "[anbima] novos=$OK_COUNT existentes=$SKIP_EXISTING_COUNT 404=$SKIP_404_COUNT falhas=$FAIL_COUNT"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::${FAIL_COUNT} data(s) ANBIMA falharam no fetch/spread (erro real, nao-404)"
            exit 1
          fi
          echo "new_count=$OK_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_dates=$NEW_DATES" >> "$GITHUB_OUTPUT"

      - name: Import B3 Trade (cache check 3 indicadores na janela 5 du B3)
        id: import_trade
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true'
        env:
          B3_TRADES_CACHE_SUMMARY: /tmp/b3_trades_cache_summary.txt
        run: |
          echo "Rodando fetch_b3_trades.py (5 dias uteis B3, refetch full so em cache-miss)"
          python fetch_b3_trades.py
          if [ -f "$B3_TRADES_CACHE_SUMMARY" ]; then
            echo "--- cache summary (trade) ---"
            cat "$B3_TRADES_CACHE_SUMMARY"
            while IFS='=' read -r key value; do
              [ -z "$key" ] && continue
              echo "${key}=${value}" >> "$GITHUB_OUTPUT"
            done < "$B3_TRADES_CACHE_SUMMARY"
          fi

      - name: Import B3 ConsolidatedRecords (cache check 3 indicadores na janela 5 du B3)
        id: import_consolidated
        # continue-on-error: se exit 1 (parcial), steps downstream (commit & push)
        # ainda rodam para salvar o que foi conseguido.
        continue-on-error: true
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true'
        env:
          B3_CONSOLIDATED_CACHE_SUMMARY: /tmp/b3_consolidated_cache_summary.txt
        run: |
          echo "Rodando fetch_b3_trades_consolidated.py (5 dias uteis B3, refetch full so em cache-miss)"
          python fetch_b3_trades_consolidated.py
          if [ -f "$B3_CONSOLIDATED_CACHE_SUMMARY" ]; then
            echo "--- cache summary (consolidated) ---"
            cat "$B3_CONSOLIDATED_CACHE_SUMMARY"
            while IFS='=' read -r key value; do
              [ -z "$key" ] && continue
              echo "${key}=${value}" >> "$GITHUB_OUTPUT"
            done < "$B3_CONSOLIDATED_CACHE_SUMMARY"
          fi

      - name: Podar historico B3 (retencao 60 du)
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          echo "Aplicando politica de retencao 60 du B3 em data/b3_trades*/"
          python scripts/podar_historico.py

      - name: Detecta mudancas em data/ e history/
        id: changes
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          set -eu
          if git status --porcelain data/ history/ data.json 2>/dev/null | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "[changes] ha mudancas em data/, history/ ou data.json"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "[changes] nenhuma mudanca detectada"
          fi

      - name: Rebuild dashboard
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          echo "Regenerando data/*.json + index.html"
          python build_dashboard.py

      - name: Commit & push
        id: commit
        if: steps.guard.outputs.is_business_day == 'true' && steps.probe.outputs.all_available == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git pull --rebase --autostash origin main; then
            echo "::error::git pull --rebase falhou (conflito?); abortando push"
            exit 1
          fi

          # --autostash silencia conflito de stash pop: rebase finaliza com
          # exit 0 mesmo quando o pop deixa markers <<<<<<</=======/>>>>>>>
          # nos arquivos. Sem este guard, `git add data/` aceita os markers e
          # corrompe main (caso 14/05/2026 -> #146 follow-up). Aborta o slot
          # quando detecta unmerged paths OU markers; proximo slot do cron
          # (intervalo de 3h) reprocessa. Trade-off: troca falha rara-mas-
          # catastrofica por falha frequente-mas-benigna. Se conflitos
          # virarem cronicos (>1-2 aborts/semana), revisar a estrategia.
          if [ -n "$(git ls-files --unmerged)" ] || \
             git grep -lE '^(<<<<<<< |======= |>>>>>>> )' \
                 -- data/ history/ index.html data.json 2>/dev/null; then
            echo "::error::Conflito de stash pop detectado (markers ou arquivos unmerged). Abortando para nao corromper main."
            git ls-files --unmerged || true
            git status
            exit 1
          fi

          git add data/ history/ data.json index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas a commitar (apos rebase)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat: ANBIMA + B3 snapshot ${TARGET_DATE} (via probe)"
          git push
          SHA=$(git rev-parse HEAD)
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "[commit] $SHA"

      - name: Step summary
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          IS_DU: ${{ steps.guard.outputs.is_business_day }}
          PROBE_ALL: ${{ steps.probe.outputs.all_available }}
          PROBE_AVAIL: ${{ steps.probe.outputs.available_count }}
          PROBE_TOTAL: ${{ steps.probe.outputs.total_count }}
          PROBE_MISSING: ${{ steps.probe.outputs.missing }}
          ANBIMA_NEW: ${{ steps.import_anbima.outputs.new_count }}
          ANBIMA_DATES: ${{ steps.import_anbima.outputs.new_dates }}
          TRADE_HITS: ${{ steps.import_trade.outputs.cache_hits }}
          TRADE_MISSES: ${{ steps.import_trade.outputs.cache_misses }}
          TRADE_REASONS: ${{ steps.import_trade.outputs.miss_reasons }}
          CONS_HITS: ${{ steps.import_consolidated.outputs.cache_hits }}
          CONS_MISSES: ${{ steps.import_consolidated.outputs.cache_misses }}
          CONS_REASONS: ${{ steps.import_consolidated.outputs.miss_reasons }}
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          {
            echo "## ANBIMA + B3 Probe & Import"
            echo ""
            echo "**Dia alvo:** \`${TARGET_DATE}\`"
            echo "**Dia util B3:** ${IS_DU:-n/a}"
            echo ""
            echo "_Cache check B3: 3 indicadores (lastUpdateDate + totalRecords + firstPageBytes). ANBIMA: gap-fill natural._"
            echo ""
            echo "### Probe"
            if [ -n "${PROBE_TOTAL:-}" ]; then
              echo "- Disponiveis: **${PROBE_AVAIL}/${PROBE_TOTAL}**"
              echo "- Todos OK: \`${PROBE_ALL}\`"
              if [ -n "${PROBE_MISSING:-}" ]; then
                echo "- Faltando: ${PROBE_MISSING}"
              fi
            else
              echo "- Probe nao executado (guard barrou)"
            fi
            echo ""
            echo "### Import"
            echo "- Snapshots ANBIMA novos: ${ANBIMA_NEW:-0}"
            if [ -n "${ANBIMA_DATES:-}" ]; then
              echo "- Datas ANBIMA novas: ${ANBIMA_DATES}"
            fi
            echo ""
            echo "#### B3 Trade (cache check)"
            if [ -n "${TRADE_HITS:-}${TRADE_MISSES:-}" ]; then
              echo "- ${TRADE_HITS:-0} cache-hit, ${TRADE_MISSES:-0} cache-miss"
              if [ -n "${TRADE_REASONS:-}" ]; then
                echo "- Motivos: ${TRADE_REASONS}"
              fi
            else
              echo "- nao executado"
            fi
            echo ""
            echo "#### B3 Consolidated (cache check)"
            if [ -n "${CONS_HITS:-}${CONS_MISSES:-}" ]; then
              echo "- ${CONS_HITS:-0} cache-hit, ${CONS_MISSES:-0} cache-miss"
              if [ -n "${CONS_REASONS:-}" ]; then
                echo "- Motivos: ${CONS_REASONS}"
              fi
            else
              echo "- nao executado"
            fi
            echo ""
            echo "### Commit"
            echo "- Mudancas detectadas: ${HAS_CHANGES:-false}"
            echo "- Commit realizado: ${COMMITTED:-false}"
            if [ -n "${COMMIT_SHA:-}" ]; then
              echo "- SHA: \`${COMMIT_SHA}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
