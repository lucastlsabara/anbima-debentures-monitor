name: ANBIMA + B3 Probe & Import

# Workflow UNICO que substitui o cron de daily_update.yml e b3_trades.yml.
#
# Roda em 3 horarios fixos por dia util B3: 21h BRT (mesmo dia ref) +
# 00h BRT, 03h BRT (madrugada apos, ref = dia util anterior).
# Idempotencia diaria garante 1 execucao real; retries automaticos se algum falhar.
# A cada execucao:
#   1. Determina o dia alvo (HOJE BRT se hora>=19, senao ONTEM BRT).
#   2. Guard B3: se nao for dia util B3, sai 0 sem fazer nada.
#   3. Idempotencia diaria: le data/.probe_state.json; se
#      last_successful_date == dia alvo, encerra verde sem rodar o resto.
#      Garante 1 execucao bem-sucedida por dia_alvo, evitando rerodar probe
#      + B3 overwrite nas horas seguintes do mesmo ciclo. Quando o dia_alvo
#      muda (ex: passa de 03h pra 19h BRT), o marker nao bloqueia.
#   4. Probe: verifica disponibilidade dos 5 arquivos (ANBIMA Debentures,
#      ANBIMA ETTJ, ANBIMA TPF, B3 Trade, B3 ConsolidatedRecords).
#   5. Se TODOS os 5 estao publicados: importa ANBIMA (gap-fill 5 du B3),
#      importa B3 (overwrite janela 5 du B3), rebuild dashboard, atualiza
#      marker data/.probe_state.json, commit & push.
#   6. Se ALGUM faltando: loga e termina verde sem commitar. Proxima tentativa
#      eh na proxima hora pelo cron. Dias antigos pendentes sao recuperados
#      automaticamente pelo gap-fill ANBIMA + overwrite janela B3.
#
# Input `force` (workflow_dispatch) ignora o marker e re-executa o pipeline
# mesmo que ja tenha rodado com sucesso pro dia_alvo (uso: reprocessar dia
# atipico manualmente).

on:
  schedule:
    # 3 disparos por dia util B3:
    # 21h BRT (HOJE) | 00h BRT do dia seguinte (ONTEM) | 03h BRT do dia seguinte (ONTEM)
    # BRT = UTC-3. Cron em UTC.
    # Slot 21h tenta primeiro; 00h e 03h sao retry automatico se 21h falhou.
    # Marker de idempotencia em data/.probe_state.json garante 1 execucao bem-sucedida por target_date.
    - cron: '0 0 * * 2-6'   # 21:00 BRT seg-sex -> ref = HOJE BRT
    - cron: '0 3 * * 2-6'   # 00:00 BRT ter-sab -> ref = ONTEM (ultimo dia util)
    - cron: '0 6 * * 2-6'   # 03:00 BRT ter-sab -> ref = ONTEM (ultimo dia util)
    #
    # Validacao de bordas:
    #  Seg 21h BRT = 00h UTC ter (dia 2) -> dispara, ref = seg (HOJE, hour=21 >= 19)
    #  Ter 00h BRT = 03h UTC ter (dia 2) -> dispara, ref = seg (ONTEM, hour=0 < 19)
    #  Ter 03h BRT = 06h UTC ter (dia 2) -> dispara, ref = seg (ONTEM, hour=3 < 19)
    #  Sex 21h BRT = 00h UTC sab (dia 6) -> dispara, ref = sex (HOJE)
    #  Sab 00h BRT = 03h UTC sab (dia 6) -> dispara, ref = sex (ONTEM)
    #  Sab 03h BRT = 06h UTC sab (dia 6) -> dispara, ref = sex (ONTEM)
    #  Dom 03h BRT = 06h UTC dom (dia 0) -> BLOQUEIA (0 nao esta em 2-6)
    #  Seg 03h BRT = 06h UTC seg (dia 1) -> BLOQUEIA (1 nao esta em 2-6)
    #
    # Feriados B3 moveis (Carnaval, Corpus Christi, 25-jan-SP, etc.) nao sao
    # cobertos por cron syntax: o guard B3 corta em ~30s em feriado.
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data alvo YYYY-MM-DD (vazio = derivar de HOJE BRT conforme horario)'
        required: false
        default: ''
      force:
        description: 'Forcar execucao mesmo se ja rodou com sucesso hoje (ignora marker de idempotencia)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Compartilha grupo com b3_trades_intraday.yml como safety net: se algum dia
# janelas se sobreporem, evita dois push concorrentes em main.
concurrency:
  group: anbima-b3-pipeline
  cancel-in-progress: false

jobs:
  probe-and-import:
    runs-on: ubuntu-latest
    # 180min (3h) = wall-clock 2h30 do fetch_b3_trades_consolidated.py + 30min
    # de buffer (setup, ANBIMA, B3 Trade, podar, rebuild dashboard, commit & push).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine target date (HOJE/ONTEM BRT conforme hora)
        id: target
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          set -eu
          TARGET_DATE=$(python3 - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          inp = (os.environ.get("INPUT_DATE") or "").strip()
          if inp:
              # Valida formato; deixa o probe falhar adiante caso seja invalido.
              datetime.strptime(inp, "%Y-%m-%d")
              print(inp)
          else:
              agora = datetime.now(ZoneInfo("America/Sao_Paulo"))
              if agora.hour >= 19:
                  alvo = agora.date()
              else:
                  alvo = agora.date() - timedelta(days=1)
              print(alvo.isoformat())
          PY
          )
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "[target] dia alvo: $TARGET_DATE"

      - name: Guard - verifica se target_date eh dia util B3
        id: guard
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          DU=$(python3 -c "
          import os
          from datetime import date
          from b3_calendar import is_b3_business_day
          d = date.fromisoformat(os.environ['TARGET_DATE'])
          print('true' if is_b3_business_day(d) else 'false')
          ")
          echo "is_business_day=$DU" >> "$GITHUB_OUTPUT"
          if [ "$DU" = "true" ]; then
            echo "[guard] $TARGET_DATE eh dia util B3 -- prosseguindo para probe"
          else
            echo "[guard] $TARGET_DATE NAO eh dia util B3 (fds ou feriado) -- encerrando verde"
          fi

      - name: Check already-completed (idempotencia diaria)
        id: idempotencia
        if: steps.guard.outputs.is_business_day == 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          if [ "${FORCE:-false}" = "true" ]; then
            echo "[idempotencia] flag force=true -- ignorando marker e prosseguindo"
            echo "already_done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MARKER='data/.probe_state.json'
          if [ ! -f "$MARKER" ]; then
            echo "[idempotencia] marker inexistente -- prosseguindo (estado inicial)"
            echo "already_done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(python3 - <<'PY'
          import json, os, sys
          marker_path = 'data/.probe_state.json'
          target = os.environ['TARGET_DATE']
          try:
              with open(marker_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except (OSError, ValueError):
              # JSON invalido ou ilegivel: trata como estado inicial
              print('already_done=false')
              print('last_success_ts=')
              sys.exit(0)
          last_date = (data or {}).get('last_successful_date')
          last_ts = (data or {}).get('last_success_ts', '')
          if last_date == target:
              print('already_done=true')
              print(f'last_success_ts={last_ts}')
          else:
              print('already_done=false')
              print(f'last_success_ts={last_ts}')
          PY
          )
          echo "$OUT" >> "$GITHUB_OUTPUT"
          ALREADY=$(echo "$OUT" | sed -n 's/^already_done=//p')
          LAST_TS=$(echo "$OUT" | sed -n 's/^last_success_ts=//p')
          if [ "$ALREADY" = "true" ]; then
            echo "[idempotencia] ja rodou com sucesso pra ${TARGET_DATE} em ${LAST_TS}. Pulando pipeline."
          else
            echo "[idempotencia] marker nao bate com ${TARGET_DATE} (ultima: ${LAST_TS:-n/a}) -- prosseguindo"
          fi

      - name: Probe - verifica disponibilidade dos 5 arquivos
        id: probe
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -u
          python3 scripts/probe_files.py \
            --date "$TARGET_DATE" \
            --github-output "$GITHUB_OUTPUT" && RC=0 || RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "[probe] todos os 5 arquivos disponiveis -- prosseguindo para import"
          elif [ "$RC" -eq 2 ]; then
            echo "[probe] algum arquivo faltando -- encerrando verde sem importar"
          else
            echo "::error::probe_files.py falhou com exit=$RC (erro real, nao 'faltando')"
            exit "$RC"
          fi

      - name: Resolve datas alvo ANBIMA (5 du B3)
        id: dates
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          DATES=$(python3 scripts/list_target_dates.py --date "$TARGET_DATE")
          echo "Datas alvo ANBIMA:"
          echo "$DATES"
          {
            echo 'dates<<EOF'
            echo "$DATES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Import ANBIMA (gap-fill 5 du B3)
        id: import_anbima
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          set -u
          mkdir -p raw
          FAIL_COUNT=0
          OK_COUNT=0
          SKIP_404_COUNT=0
          SKIP_EXISTING_COUNT=0
          NEW_DATES=""
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            echo "::group::ANBIMA $d"
            if [ -f "history/${d}.json" ]; then
              echo "[skip] history/${d}.json ja existe; pulando."
              SKIP_EXISTING_COUNT=$((SKIP_EXISTING_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            python3 fetch_anbima.py --date "$d" --out parsed.json && RC=0 || RC=$?
            if [ "$RC" -eq 2 ]; then
              echo "[skip] $d: ANBIMA 404 (fds/feriado ou ainda nao publicado)"
              SKIP_404_COUNT=$((SKIP_404_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            if [ "$RC" -ne 0 ]; then
              echo "::error::fetch_anbima.py falhou para $d (exit=$RC)"
              FAIL_COUNT=$((FAIL_COUNT+1))
              echo "::endgroup::"
              continue
            fi
            python3 compute_spreads.py --date "$d" --in parsed.json --out data.json
            OK_COUNT=$((OK_COUNT+1))
            if [ -z "$NEW_DATES" ]; then
              NEW_DATES="$d"
            else
              NEW_DATES="${NEW_DATES}, ${d}"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.dates.outputs.dates }}"
          echo "[anbima] novos=$OK_COUNT existentes=$SKIP_EXISTING_COUNT 404=$SKIP_404_COUNT falhas=$FAIL_COUNT"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::${FAIL_COUNT} data(s) ANBIMA falharam no fetch/spread (erro real, nao-404)"
            exit 1
          fi
          echo "new_count=$OK_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_dates=$NEW_DATES" >> "$GITHUB_OUTPUT"

      - name: Import B3 Trade (overwrite janela 5 du B3)
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          echo "Rodando fetch_b3_trades.py (5 dias uteis B3)"
          python fetch_b3_trades.py

      - name: Import B3 ConsolidatedRecords (overwrite janela 5 du B3)
        id: import_consolidated
        # continue-on-error: se exit 1 (parcial), steps downstream (commit & push)
        # ainda rodam para salvar o que foi conseguido. O step "Atualiza marker"
        # checa outcome != 'failure' das etapas de import, entao parcial NAO
        # atualiza marker (proxima retry reprocessa).
        continue-on-error: true
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          echo "Rodando fetch_b3_trades_consolidated.py (5 dias uteis B3)"
          python fetch_b3_trades_consolidated.py

      - name: Podar historico B3 (retencao 60 du)
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          echo "Aplicando politica de retencao 60 du B3 em data/b3_trades*/"
          python scripts/podar_historico.py

      - name: Atualiza marker de idempotencia (data/.probe_state.json)
        # Inclui check do outcome do import_consolidated: se for 'failure'
        # (parcial -- continue-on-error mantem o workflow rodando), o marker
        # NAO eh atualizado, garantindo que a proxima retry reprocesse.
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true' && steps.import_consolidated.outcome == 'success'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          mkdir -p data
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          target = os.environ['TARGET_DATE']
          now = datetime.now(ZoneInfo('America/Sao_Paulo')).replace(microsecond=0).isoformat()
          marker = {
              'last_successful_date': target,
              'last_success_ts': now,
          }
          with open('data/.probe_state.json', 'w', encoding='utf-8') as f:
              json.dump(marker, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write('\n')
          print(f"[marker] data/.probe_state.json atualizado: {marker}")
          PY

      - name: Detecta mudancas em data/ e history/
        id: changes
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true'
        run: |
          set -eu
          if git status --porcelain data/ history/ data.json 2>/dev/null | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "[changes] ha mudancas em data/, history/ ou data.json"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "[changes] nenhuma mudanca detectada"
          fi

      - name: Rebuild dashboard
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          echo "Regenerando data/*.json + index.html"
          python build_dashboard.py

      - name: Commit & push
        id: commit
        if: steps.guard.outputs.is_business_day == 'true' && steps.idempotencia.outputs.already_done != 'true' && steps.probe.outputs.all_available == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git pull --rebase --autostash origin main; then
            echo "::error::git pull --rebase falhou (conflito?); abortando push"
            exit 1
          fi
          git add data/ history/ data.json index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas a commitar (apos rebase)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat: ANBIMA + B3 snapshot ${TARGET_DATE} (via probe)"
          git push
          SHA=$(git rev-parse HEAD)
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "[commit] $SHA"

      - name: Step summary
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          IS_DU: ${{ steps.guard.outputs.is_business_day }}
          IDEMP_SKIPPED: ${{ steps.idempotencia.outputs.already_done }}
          IDEMP_LAST_TS: ${{ steps.idempotencia.outputs.last_success_ts }}
          PROBE_ALL: ${{ steps.probe.outputs.all_available }}
          PROBE_AVAIL: ${{ steps.probe.outputs.available_count }}
          PROBE_TOTAL: ${{ steps.probe.outputs.total_count }}
          PROBE_MISSING: ${{ steps.probe.outputs.missing }}
          ANBIMA_NEW: ${{ steps.import_anbima.outputs.new_count }}
          ANBIMA_DATES: ${{ steps.import_anbima.outputs.new_dates }}
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          if [ "${IDEMP_SKIPPED:-false}" = "true" ]; then
            {
              echo "## ANBIMA + B3 Probe & Import - PULADO (idempotencia)"
              echo ""
              echo "**Dia alvo:** \`${TARGET_DATE}\`"
              echo "**Motivo:** ja rodou com sucesso em ${IDEMP_LAST_TS:-?}"
              echo ""
              echo "Para forcar reexecucao, dispare manualmente com input \`force=true\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## ANBIMA + B3 Probe & Import"
            echo ""
            echo "**Dia alvo:** \`${TARGET_DATE}\`"
            echo "**Dia util B3:** ${IS_DU:-n/a}"
            echo "**Idempotencia skipped:** false"
            echo ""
            echo "### Probe"
            if [ -n "${PROBE_TOTAL:-}" ]; then
              echo "- Disponiveis: **${PROBE_AVAIL}/${PROBE_TOTAL}**"
              echo "- Todos OK: \`${PROBE_ALL}\`"
              if [ -n "${PROBE_MISSING:-}" ]; then
                echo "- Faltando: ${PROBE_MISSING}"
              fi
            else
              echo "- Probe nao executado (guard barrou)"
            fi
            echo ""
            echo "### Import"
            echo "- Snapshots ANBIMA novos: ${ANBIMA_NEW:-0}"
            if [ -n "${ANBIMA_DATES:-}" ]; then
              echo "- Datas ANBIMA novas: ${ANBIMA_DATES}"
            fi
            echo "- B3 Trade + ConsolidatedRecords: overwrite janela 5 du (se import rodou)"
            echo ""
            echo "### Commit"
            echo "- Mudancas detectadas: ${HAS_CHANGES:-false}"
            echo "- Commit realizado: ${COMMITTED:-false}"
            if [ -n "${COMMIT_SHA:-}" ]; then
              echo "- SHA: \`${COMMIT_SHA}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
